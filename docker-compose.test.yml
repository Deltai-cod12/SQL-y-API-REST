
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: comercial_estrella_db_test
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}

    ports:
      - "1434:1433"

    volumes:
      - sqlserver_test_data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ./init.sql:/scripts/init.sql:ro
      - ./backend/sql:/scripts/sql:ro

    entrypoint: ["/bin/bash", "/scripts/sql/db-init.sh"]

volumes:
  sqlserver_test_data:
